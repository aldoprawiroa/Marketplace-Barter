<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Transaksi - SwapSpace</title>
    <!-- Menggunakan Tailwind CSS via CDN untuk styling cepat dan konsisten -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Styles untuk mencocokkan tema SwapSpace */
        .theme-text { color: #0f172a; }
        .theme-primary { color: #0d9488; }
        .theme-primary-bg { background-color: #0d9488; }
        .theme-primary-bg:hover { background-color: #0f766e; }
        
        .status-badge {
            @apply px-2 py-1 rounded-full text-xs font-semibold;
        }
        .status-pending { @apply bg-yellow-100 text-yellow-800; }
        .status-success { @apply bg-green-100 text-green-800; }
        .status-cancelled { @apply bg-red-100 text-red-800; }
        .status-track { @apply bg-blue-100 text-blue-800; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-slate-700">

    <!-- Navbar (Sama dengan halaman lain) -->
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold theme-primary">SwapSpace</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-500 hover:text-gray-700">Katalog</a>
                    <a href="#" class="text-gray-500 hover:text-gray-700">Login</a>
                    <a href="#" class="text-gray-500 hover:text-gray-700">Upload</a>
                    <a href="swap.html" class="text-gray-500 hover:text-gray-700">Swap</a>
                    <a href="track.html" class="text-teal-600 font-semibold">Tracking</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8">
            <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wide">Riwayat Transaksi</h2>
            <h1 class="text-3xl font-bold text-gray-900 mt-2">Lacak Status Barang Anda</h1>
            <p class="mt-2 text-gray-600">Pantau kondisi swap: Menunggu, Sedang Dikirim, Selesai, atau Dibatalkan.</p>
        </div>

        <!-- Ringkasan Profil (Diatur via JS) -->
        <div id="profile-summary" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <!-- Konten akan diisi oleh JS -->
        </div>

        <!-- Filter dan Reset -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-lg shadow-sm">
            <div class="flex space-x-2 mb-4 md:mb-0">
                <button onclick="filterTransactions('all')" class="filter-btn px-4 py-2 rounded-md text-sm font-medium bg-gray-900 text-white transition">Semua</button>
                <button onclick="filterTransactions('pending')" class="filter-btn px-4 py-2 rounded-md text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition">Menunggu</button>
                <button onclick="filterTransactions('success')" class="filter-btn px-4 py-2 rounded-md text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition">Sukses</button>
                <button onclick="filterTransactions('cancelled')" class="filter-btn px-4 py-2 rounded-md text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition">Dibatalkan</button>
            </div>
            
            <div class="flex items-center space-x-4">
                <input type="text" id="search-input" placeholder="Cari barang atau kode..." class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                <button onclick="resetDemo()" class="text-red-500 text-sm hover:text-red-700 font-medium border border-red-200 px-3 py-2 rounded-md hover:bg-red-50">Reset Demo</button>
            </div>
        </div>

        <!-- Tabel Tracking -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kode Swap</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Barang Tujuan (Ingin)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Barang Penawaran (Punya)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Selisih</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="transaction-list" class="bg-white divide-y divide-gray-200">
                    <!-- Data akan dimuat di sini oleh JS -->
                </tbody>
            </table>
            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <p class="text-gray-400 text-lg">Belum ada data transaksi.</p>
            </div>
        </div>
    </main>

    <!-- Script JS -->
    <script src="js/track.js"></script>
</body>
</html>
