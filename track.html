<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Transaksi - SwapSpace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tabler Icons (Icon Library yang Rapi & Modern) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .ti { vertical-align: middle; }
        /* Custom Status Colors */
        .status-badge { @apply px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1; }
        .status-pending { @apply bg-yellow-50 text-yellow-700 border border-yellow-200; }
        .status-success { @apply bg-emerald-50 text-emerald-700 border border-emerald-200; }
        .status-cancelled { @apply bg-red-50 text-red-700 border border-red-200; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="ti ti-repeat text-2xl text-teal-600"></i>
                    <span class="text-xl font-bold text-slate-900 tracking-tight">SwapSpace</span>
                </div>
                <div class="flex items-center space-x-6 text-sm font-medium text-gray-500">
                    <a href="index.html" class="hover:text-teal-600 transition">Katalog</a>
                    <a href="#" class="hover:text-teal-600 transition">Login</a>
                    <a href="#" class="hover:text-teal-600 transition">Upload</a>
                    <a href="swap.html" class="hover:text-teal-600 transition">Swap</a>
                    <a href="track.html" class="text-teal-600 bg-teal-50 px-3 py-1 rounded-lg transition">Tracking</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Lacak Status Barang Anda</h1>
            <p class="text-gray-500 mt-1">Pantau kondisi swap: Menunggu, Dikirim, Selesai, atau Dibatalkan.</p>
        </div>

        <!-- Ringkasan Profil (Summary Cards) -->
        <div id="profile-summary" class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
            <!-- Diisi oleh JS -->
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex bg-gray-100 p-1 rounded-lg">
                <button onclick="filterTransactions('all')" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all duration-200">Semua</button>
                <button onclick="filterTransactions('pending')" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all duration-200">Menunggu</button>
                <button onclick="filterTransactions('success')" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all duration-200">Sukses</button>
                <button onclick="filterTransactions('cancelled')" class="filter-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all duration-200">Dibatalkan</button>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <i class="ti ti-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Cari barang atau kode..." class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
                </div>
                <button onclick="resetDemo()" class="flex items-center gap-1 px-3 py-2 border border-red-200 text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium transition">
                    <i class="ti ti-refresh"></i> Reset
                </button>
            </div>
        </div>

        <!-- Tabel Tracking -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Kode</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Barang Tujuan</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Barang Penawaran</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Selisih</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list" class="bg-white divide-y divide-gray-100">
                        <!-- Data JS -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden text-center py-12">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 mb-3">
                    <i class="ti ti-box text-gray-400 text-xl"></i>
                </div>
                <p class="text-gray-500 font-medium">Belum ada transaksi ditemukan.</p>
            </div>
        </div>
    </main>

    <script src="js/track.js"></script>
</body>
</html>
